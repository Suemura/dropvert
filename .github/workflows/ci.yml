name: CI

# lint / test / build を自動実行する。ランナーが macos-latest なのは、sips /
# osacompile / codesign / PlistBuddy が macOS にしか無いため。
#
# tests/run.sh が見ているのは convert.sh 層 (1 ファイルの変換) と
# run.sh 層 (サマリの契約・作業ディレクトリの契約・並列度) の 2 つ。
# ゴミ箱への移動 (trash.js) は GUI セッションのないランナーでも動くことを
# 実測済みなので、テストに含めてよい (CLAUDE.md「注意点」参照)。
# CI で自動化できない層 (実際のドロップ、進捗ウィンドウ、停止ボタン、
# 設定ウィンドウの見た目) は CLAUDE.md「テスト方法」の手動チェックリストを参照。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR に新しい push があったら古いランを打ち切る。main では打ち切らない
# (連続してマージしたとき、先のマージコミットが緑を持たないまま残るため)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # webp formula は cwebp / gif2webp / webpmux を持ってくる。3 つとも
      # tests/run.sh が使う (webpmux はアニメーション WebP の素材作り)。
      - name: 依存をインストール
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install --formula webp shellcheck shfmt

      # lint.sh は shellcheck / shfmt が無ければ SKIP して exit 0 を返す
      # (ローカルで brew を必須にしないための仕様)。CI でそれをやると
      # 「入っていないから緑」になってしまうため、先に存在を確かめる。
      - name: ツールの存在を確認
        run: |
          # macOS の bash は 3.2 で、command -v に複数の名前を渡すと
          # 「どれか 1 つでも見つかれば 0」を返す。1 つずつ確かめること。
          for tool in cwebp gif2webp webpmux shellcheck shfmt; do
            command -v "$tool" || exit 1
          done

      - name: lint
        run: |
          status=0
          ./lint.sh >"$RUNNER_TEMP/lint.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/lint.log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # 上の確認ステップを通っていれば起きないが、二重の歯止め。
          if grep -q '^SKIP' "$RUNNER_TEMP/lint.log"; then
            echo "::error::lint の一部が SKIP されました" >&2
            exit 1
          fi

      - name: test
        run: ./tests/run.sh

      - name: build
        run: ./build.sh "$RUNNER_TEMP/out"

      - name: 署名を検証
        run: codesign --verify --deep --strict "$RUNNER_TEMP/out/Dropvert.app"
